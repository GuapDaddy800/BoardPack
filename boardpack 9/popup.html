<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardPack</title><link rel="stylesheet" href="popup.css"></head><body><main><header><h1><img src="icons/icon-48.png" alt="" width="38" height="38">BoardPack ↘</h1><span>IMAGES → ZIP</span></header><section class="card"><label for="url">Pinterest Board URL</label><input id="url" type="url" placeholder="https://www.pinterest.com/you/board/"><button id="export">Download ZIP</button></section><div class="options"><label><input id="auto" type="checkbox" checked><span class="switch"></span>Download ZIP when scan finishes</label><label><input id="original" type="checkbox" checked><span class="switch"></span>Try original resolution</label></div><section class="stats" aria-label="Export counts"><div><span class="icon">⌕</span><strong id="found">0</strong><span>found</span></div><div><span class="icon">▣</span><strong id="packed">0</strong><span>packed</span></div><div><span class="icon">♧</span><strong id="disk">0</strong><span>ZIPs saved</span></div></section><progress id="progress" value="0" max="1" aria-label="Export progress"></progress><p id="status" role="status" aria-live="polite">Ready to scan your board.</p><small id="detail">0 MB · 0 failed</small><div class="buttons"><button id="current">▱ Scan open board</button><button id="start">♧ Scan pasted link</button><button id="stop" disabled>■ Stop</button></div><footer>You can close this popup. Keep Vivaldi running.<br>Scanning stops automatically at the end of the board.<br>Open-board mode uses your existing signed-in tab.<br><a href="#" id="show">Show scan tab</a> · <a href="#" id="downloads">Downloads</a></footer></main><script src="popup.js"></script></body></html>
